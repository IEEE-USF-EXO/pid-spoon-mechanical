name: Task
description: A unit of work with a defined deliverable and evidence.
labels: []
body:
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: What will exist when this is done. One sentence, stated as an artifact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence required
      description: What proves it works. Name the measurement, the file, or the review.
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Due date
      description: YYYY-MM-DD.
    validations:
      required: false
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers or interface IDs this is blocked by.
    validations:
      required: false
